
name: Assets Management CI

on:
  push:
    branches:
      - phase2
  pull_request:
    branches:
      - phase2

permissions:
  contents: read

jobs:
  lint:
    name: Ruff checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assets_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d assets_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test

      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/assets_management_test
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/assets_management_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/assets_management_test

      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2

      JWT_SECRET_KEY: ci-only-jwt-secret-key-not-for-production-123456
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"

      ASSET_TAG_COMPANY_PREFIX: IL
      SEED_USER_PASSWORD: "CI-Test-User-Password123!"
      SEED_ADMIN_PASSWORD: "CI-Test-Admin-Password123!"

      CORS_ORIGINS: http://localhost:3000

      SMTP_USERNAME: ci@example.com
      SMTP_PASSWORD: ci-only-password
      MAIL_FROM_EMAIL: ci@example.com

      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
      S3_BUCKET_NAME: ci-test-bucket
      S3_UPLOAD_CALLBACK_SECRET: ci-only-s3-callback-secret-not-for-production-123

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest
